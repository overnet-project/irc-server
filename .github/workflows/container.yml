name: container-build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container.yml'
      - 'deploy/podman/**'
      - 'bin/**'
      - 'lib/**'
      - 'Makefile.PL'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/container.yml'
      - 'deploy/podman/**'
      - 'bin/**'
      - 'lib/**'
      - 'Makefile.PL'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Build and smoke-test the IRC server image
    steps:
      - uses: actions/checkout@v4
        with:
          repository: overnet-project/overnet-perl

      - uses: actions/checkout@v4
        with:
          path: irc-server

      - name: Podman version
        run: podman version

      - name: Build the IRC server image
        run: |
          podman build \
            --file irc-server/deploy/podman/Containerfile \
            --tag overnet-irc:ci \
            "$GITHUB_WORKSPACE"

      - name: Smoke-test the IRC server image
        run: irc-server/deploy/podman/smoke-test.sh overnet-irc:ci

      - name: Validate the Quadlet units
        run: irc-server/deploy/podman/quadlet-check.sh
